[pytest]
# Why this file exists
# --------------------
# The project had no pytest configuration at all. `pytest tests` — the command
# in the project's own testing.md — failed at collection, because several files
# in tests/ execute network and ML code at import time. CI worked around it by
# naming a single file explicitly:
#
#     python -m pytest tests/test_auth.py -q
#
# That command also tested the WRONG code: tests/test_auth.py imports
# `app.auth`, the legacy Streamlit copy, while production serves
# `backend/auth.py`. The two are identical today and will drift.
#
# pythonpath puts both the repo root and backend/ on sys.path, so tests can
# import the deployed modules directly (`from auth import ...`) exactly as
# main.py does.

testpaths = tests
pythonpath = . backend

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    unit: no external dependencies, safe to run anywhere
    integration: requires a live backend, database, or third-party API
    security: asserts a specific security control (maps to testing.md ST-xxx)

filterwarnings =
    ignore::DeprecationWarning
